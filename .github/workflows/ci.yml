name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build + unit/integration tests
    runs-on: ubuntu-latest   # has Docker available for Testcontainers
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Klassd.slnx -c Release

      # TUnit on Microsoft.Testing.Platform: `dotnet test` is unsupported on the
      # .NET 10 SDK, so run each test project directly. Exit code = pass/fail.
      - name: Unit tests
        run: dotnet run --project tests/Klassd.UnitTests -c Release --no-build

      # Integration tests spin up Postgres/Mongo/Redis/MinIO via Testcontainers.
      # Docker is available on ubuntu-latest; tests carry [SkipWhenDockerUnavailable].
      - name: Integration tests
        run: dotnet run --project tests/Klassd.IntegrationTests -c Release --no-build

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Klassd.slnx -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Klassd.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # GlobalHooks boots the Sample on a free port with a throwaway SQLite DB.
      - name: UI tests
        run: dotnet run --project tests/Klassd.UiTests -c Release --no-build
